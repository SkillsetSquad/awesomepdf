services:
  # Coolify builds this image before replacing the running application.
  # Route the domain to web's internal port 80; no host port is published.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
        APP_VERSION: ${APP_VERSION:-}
        DISABLE_UPDATE_CHECK: ${DISABLE_UPDATE_CHECK:-false}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://awsomepdf.com}
        SOURCE_REVISION: ${SOURCE_REVISION:-}
    expose:
      - "80"
    restart: unless-stopped

  # Target web-dev explicitly so development does not also start production.
  web-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "apk add --no-cache git 2>/dev/null || true; npm ci && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      APP_VERSION: ${APP_VERSION:-}
      DISABLE_UPDATE_CHECK: ${DISABLE_UPDATE_CHECK:-false}
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    profiles:
      - dev

volumes:
  node_modules:
